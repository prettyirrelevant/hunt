name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache models and test PostgreSQL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/embed
            assets/public/vendor
            target/tmp
          key: downloads-${{ runner.os }}-v1
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint server
        run: cargo clippy --all-targets --features ssr -- -D warnings
      - name: Lint browser
        run: cargo clippy --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --features ssr
